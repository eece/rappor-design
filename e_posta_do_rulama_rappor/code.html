<!-- Header -->

<h1 class="font-headline-md text-headline-md text-primary mb-sm">E-Posta Adresinizi Doğrulayın</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Hesabınızı aktifleştirmek için e-postanıza gönderilen 6 haneli kodu girin.
            </p>
</div>
<!-- OTP Form -->
<form class="flex flex-col gap-lg">
<div class="flex justify-center gap-xs md:gap-sm" id="otp-container">
<input aria-label="Digit 1" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 5" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="otp-input w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border border-outline-variant rounded-lg bg-surface focus:bg-surface-container-lowest transition-all" maxlength="1" type="text"/>
</div>
<!-- CTA -->
<button class="w-full bg-primary text-on-primary font-button text-button py-sm px-md rounded-lg hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center justify-center gap-sm" type="button">
                Doğrula
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Resend Section -->
<div class="mt-lg text-center font-body-sm text-body-sm text-on-surface-variant flex flex-col items-center gap-xs">
<span>Kodu almadınız mı?</span>
<button class="font-label-md text-label-md text-secondary hover:text-secondary-container transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="resend-btn">
                Kodu Tekrar Gönder <span id="timer">(01:59)</span>
</button>
</div>
</div>
<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            // Restrict to numbers
            input.addEventListener('keypress', function (e) {
                if (e.key < '0' || e.key > '9') {
                    e.preventDefault();
                }
            });
        });
        
        // Simple Timer Logic
        let timeLeft = 119; // 1:59
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "";
                resendBtn.disabled = false;
                resendBtn.classList.remove('disabled:opacity-50', 'disabled:cursor-not-allowed');
            } else {
                const minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                seconds = seconds < 10 ? '0' + seconds : seconds;
                timerElement.textContent = `(0${minutes}:${seconds})`;
                timeLeft -= 1;
            }
        }, 1000);
    </script>
