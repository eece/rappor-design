<body class="min-h-screen flex items-center justify-center p-md md:p-lg">
<div class="glass-card w-full max-w-md rounded-xl p-xl flex flex-col gap-lg">
<!-- Logo Header -->
<div class="flex flex-col items-center gap-sm mb-sm">
<img alt="RAPPOR Education Platform Logo" class="h-16 w-auto object-contain mb-xs" src="https://lh3.googleusercontent.com/aida-public/AB6AXuATBcj7vxtMtemaqRSPRf14y3ji3dHqN2LFwvzfcG-HpdSdKargsywuB7OwCqhoybPqUtq_Mhsb0vHMctJl1SIBbzeJ8tfLsyt3Y5O4-baZs_ATiCuS8EKTvzzTia4yr3xpKBIydbaSi8RuScvTlDLLNsfgn9h9rM7ip2cFeXJcscrKU55BbwWSXD9Q8GnZq-KrH8ZWUHqPPJyW0ukruosx66BGkBvYNCtRYlpAj81kzQbEmi4s-bU3ug"/>
<h1 class="font-headline-md text-headline-md text-primary text-center">Hoş Geldiniz</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Eğitim portalına erişmek için giriş yapın.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">E-posta Adresi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" id="email" name="email" placeholder="ornek@ogrenci.edu.tr" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Şifre</label>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-fixed-variant transition-colors" href="#">Şifremi Unuttum?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-button text-button py-3 rounded-lg hover:bg-primary-container transition-colors mt-sm flex justify-center items-center gap-sm" type="submit">
                Giriş Yap
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-outline font-body-sm text-body-sm">veya</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<div class="flex flex-col gap-sm">
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-button text-button py-2.5 rounded-lg hover:bg-surface-container-low transition-colors flex justify-center items-center gap-sm">
<span class="material-symbols-outlined">g_mobiledata</span>
                Google ile Giriş Yap
            </button>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-button text-button py-2.5 rounded-lg hover:bg-surface-container-low transition-colors flex justify-center items-center gap-sm">
<span class="material-symbols-outlined">window</span>
                Microsoft ile Giriş Yap
            </button>

<div class="text-center mt-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
