<style type="text/tailwindcss">
        @layer utilities {
            .role-btn {
                @apply flex flex-col items-center justify-center p-lg bg-surface-container-lowest border border-outline-variant rounded-lg cursor-pointer transition-all duration-200 hover:border-secondary hover:shadow-sm;
            }
            .role-btn.active {
                @apply border-2 border-secondary bg-surface-container-low shadow-sm;
            }
            .input-field {
                @apply w-full px-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none font-body-md text-body-md text-on-surface placeholder-on-surface-variant;
            }

<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-md antialiased text-on-surface p-md">
<main class="w-full max-w-[480px] mx-auto">
<!-- Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,10,30,0.08)] p-xl border border-surface-container-low">
<!-- Header & Logo -->
<div class="flex flex-col items-center mb-xl">
<img alt="RAPPOR Education Platform Logo" class="h-20 mb-sm object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuATBcj7vxtMtemaqRSPRf14y3ji3dHqN2LFwvzfcG-HpdSdKargsywuB7OwCqhoybPqUtq_Mhsb0vHMctJl1SIBbzeJ8tfLsyt3Y5O4-baZs_ATiCuS8EKTvzzTia4yr3xpKBIydbaSi8RuScvTlDLLNsfgn9h9rM7ip2cFeXJcscrKU55BbwWSXD9Q8GnZq-KrH8ZWUHqPPJyW0ukruosx66BGkBvYNCtRYlpAj81kzQbEmi4s-bU3ug"/>
<h1 class="font-headline-md text-headline-md text-primary text-center">Hesap Oluştur</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mt-xs">Eğitim yolculuğunuza başlamak için kayıt olun.</p>
</div>
<!-- Registration Form -->
<form class="space-y-lg flex flex-col" id="registrationForm">
<!-- Role Selection -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block mb-unit">Hesap Türünüzü Seçin</label>
<div class="grid grid-cols-3 gap-sm">
<label class="role-btn active" id="role-ogretmen">
<input checked="" class="hidden" name="role" type="radio" value="ogretmen"/>
<span class="material-symbols-outlined text-secondary text-3xl mb-xs" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-button text-button text-on-surface">Öğretmen</span>
</label>
<label class="role-btn" id="role-ogrenci">
<input class="hidden" name="role" type="radio" value="ogrenci"/>
<span class="material-symbols-outlined text-on-surface-variant text-3xl mb-xs transition-colors group-hover:text-secondary" data-icon="face">face</span>
<span class="font-button text-button text-on-surface">Öğrenci</span>
</label>
<label class="role-btn" id="role-veli">
<input class="hidden" name="role" type="radio" value="veli"/>
<span class="material-symbols-outlined text-on-surface-variant text-3xl mb-xs transition-colors group-hover:text-secondary" data-icon="family_home">family_home</span>
<span class="font-button text-button text-on-surface">Veli</span>
</label>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-md">
<div>
<label class="sr-only" for="fullName">Ad Soyad</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="person">person</span>
</div>
<input class="input-field pl-10" id="fullName" name="fullName" placeholder="Ad Soyad" required="" type="text"/>
</div>
</div>
<div>
<label class="sr-only" for="email">E-posta Adresi</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</div>
<input class="input-field pl-10" id="email" name="email" placeholder="E-posta Adresi" required="" type="email"/>
</div>
</div>
<div>
<label class="sr-only" for="password">Şifre</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</div>
<input class="input-field pl-10" id="password" name="password" placeholder="Şifre" required="" type="password"/>
</div>
</div>
</div>
<!-- Terms and Conditions -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="focus:ring-secondary h-4 w-4 text-secondary border-outline-variant rounded" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            Kayıt olarak <a class="text-secondary hover:underline font-bold" href="#">Kullanım Koşulları</a>'nı ve <a class="text-secondary hover:underline font-bold" href="#">Gizlilik Politikası</a>'nı kabul ediyorum.
                        </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-button text-button py-3 px-4 rounded-lg hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors shadow-sm" type="submit">
                    Kayıt Ol
                </button>
<div class="text-center mt-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Zaten hesabınız var mı? <a class="text-secondary font-bold hover:underline" href="#">Giriş Yap</a>
</p>
</div>
</form>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const roleButtons = document.querySelectorAll('.role-btn');
            
            roleButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    // Remove active class and reset icons for all
                    roleButtons.forEach(b => {
                        b.classList.remove('active');
                        const icon = b.querySelector('.material-symbols-outlined');
                        icon.classList.remove('text-secondary');
                        icon.classList.add('text-on-surface-variant');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    });

                    // Add active class and highlight icon for clicked
                    this.classList.add('active');
                    const activeIcon = this.querySelector('.material-symbols-outlined');
                    activeIcon.classList.remove('text-on-surface-variant');
                    activeIcon.classList.add('text-secondary');
                    activeIcon.style.fontVariationSettings = "'FILL' 1";
                });
            });
        });
    </script>
</body></html>
